<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc">
  <title id="title">VeriDoc AI query pipeline</title>
  <desc id="desc">Each message passes safety_check and classify_intent. Small talk gets a short reply and off-topic requests the admin's refusal text. Medical questions are condensed, then retrieve, generate and verify run in a loop: a failed audit escalates retrieval, up to three iterations; a pass is finalized with citations; a third failure, or nothing retrieved, returns the fixed fallback.</desc>
  <style>
    .surface { fill: #fcfcfb; }
    .node { fill: #ffffff; stroke: #c9c8c2; stroke-width: 1.5; }
    .agent { fill: #ffffff; stroke: #2a78d6; stroke-width: 2; }
    .good { fill: #ffffff; stroke: #008300; stroke-width: 2; }
    .safe { fill: #ffffff; stroke: #eb6834; stroke-width: 2; }
    .ink { fill: #0b0b0b; }
    .ink-2 { fill: #52514e; }
    .edge { stroke: #52514e; stroke-width: 1.5; fill: none; }
    .loop { stroke: #2a78d6; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .arrow { fill: #52514e; }
    .arrow-loop { fill: #2a78d6; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .node, .agent, .good, .safe { fill: #242422; }
      .node { stroke: #4a4944; }
      .agent { stroke: #3987e5; }
      .good { stroke: #0ca30c; }
      .safe { stroke: #d95926; }
      .ink { fill: #f0efec; }
      .ink-2 { fill: #c3c2b7; }
      .edge { stroke: #c3c2b7; }
      .loop { stroke: #3987e5; }
      .arrow { fill: #c3c2b7; }
      .arrow-loop { fill: #3987e5; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="head-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-loop" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="surface" x="0" y="0" width="900" height="470" rx="8"/>
  <text class="ink" x="24" y="32" font-size="18" font-weight="600">Query pipeline (LangGraph)</text>
  <text class="ink-2" x="24" y="52" font-size="12">Blue outline: the two LLM agents. Green: the only way to a verified answer. Orange: the safe fallback.</text>

  <!-- row 1: entry -->
  <rect class="node" x="30" y="90" width="150" height="44" rx="8"/>
  <text class="ink" x="105" y="117" font-size="13" text-anchor="middle">safety_check</text>
  <rect class="node" x="230" y="90" width="150" height="44" rx="8"/>
  <text class="ink" x="305" y="117" font-size="13" text-anchor="middle">classify_intent</text>
  <path class="edge" d="M180,112 H228" marker-end="url(#head)"/>

  <rect class="node" x="500" y="74" width="150" height="40" rx="8"/>
  <text class="ink" x="575" y="99" font-size="13" text-anchor="middle">smalltalk_reply</text>
  <rect class="node" x="500" y="126" width="150" height="40" rx="8"/>
  <text class="ink" x="575" y="151" font-size="13" text-anchor="middle">decline</text>
  <path class="edge" d="M380,106 H430 V94 H498" marker-end="url(#head)"/>
  <text class="ink-2" x="438" y="87" font-size="11">smalltalk</text>
  <path class="edge" d="M380,118 H430 V146 H498" marker-end="url(#head)"/>
  <text class="ink-2" x="438" y="180" font-size="11">out_of_scope</text>
  <text class="ink-2" x="664" y="99" font-size="11">short reply, no medical content</text>
  <text class="ink-2" x="664" y="151" font-size="11">admin's refusal text, verbatim</text>

  <!-- row 2: medical loop -->
  <path class="edge" d="M305,134 V190 H105 V228" marker-end="url(#head)"/>
  <text class="ink-2" x="115" y="183" font-size="11">medical (always, for an emergency)</text>

  <rect class="node" x="30" y="230" width="150" height="44" rx="8"/>
  <text class="ink" x="105" y="257" font-size="13" text-anchor="middle">condense_query</text>
  <rect class="node" x="220" y="230" width="150" height="44" rx="8"/>
  <text class="ink" x="295" y="257" font-size="13" text-anchor="middle">retrieve</text>
  <rect class="agent" x="410" y="230" width="150" height="44" rx="8"/>
  <text class="ink" x="485" y="257" font-size="13" text-anchor="middle">generate</text>
  <rect class="agent" x="600" y="230" width="150" height="44" rx="8"/>
  <text class="ink" x="675" y="257" font-size="13" text-anchor="middle">verify</text>
  <rect class="good" x="780" y="230" width="100" height="44" rx="8"/>
  <text class="ink" x="830" y="257" font-size="13" text-anchor="middle">finalize</text>

  <path class="edge" d="M180,252 H218" marker-end="url(#head)"/>
  <path class="edge" d="M370,252 H408" marker-end="url(#head)"/>
  <path class="edge" d="M560,252 H598" marker-end="url(#head)"/>
  <path class="edge" d="M750,252 H778" marker-end="url(#head)"/>
  <text class="ink-2" x="752" y="244" font-size="11">pass</text>

  <!-- escalate loop -->
  <rect class="node" x="410" y="350" width="150" height="44" rx="8"/>
  <text class="ink" x="485" y="377" font-size="13" text-anchor="middle">escalate</text>
  <path class="loop" d="M660,274 V372 H562" marker-end="url(#head-loop)"/>
  <text class="ink-2" x="572" y="366" font-size="11">fail, iteration &lt; 3</text>
  <path class="loop" d="M410,372 H295 V276" marker-end="url(#head-loop)"/>
  <text class="ink-2" x="285" y="322" font-size="11" text-anchor="end">wider search:</text>
  <text class="ink-2" x="285" y="338" font-size="11" text-anchor="end">Top-3 → Top-8 parents</text>
  <text class="ink-2" x="285" y="354" font-size="11" text-anchor="end">→ Top-15 parents</text>

  <!-- fallback -->
  <rect class="safe" x="780" y="350" width="100" height="44" rx="8"/>
  <text class="ink" x="830" y="377" font-size="13" text-anchor="middle">fallback</text>
  <path class="edge" d="M700,274 V300 H830 V348" marker-end="url(#head)"/>
  <text class="ink-2" x="712" y="294" font-size="11">fail at iteration 3</text>

  <text class="ink-2" x="24" y="430" font-size="12">An uncited or "not in documents" draft skips the Verifier and counts as a failed iteration. A retrieval that finds nothing,</text>
  <text class="ink-2" x="24" y="448" font-size="12">or a low score at the last iteration, goes straight to the fallback. An emergency's reply, a fallback included, starts with the emergency notice.</text>
</svg>
