[project]
name = "veridoc-backend"
version = "0.1.0"
description = "VeriDoc AI backend: auth, users, admin, documents, chat gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.34",
    "httpx==0.28.1",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "C4", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
